{% extends 'apps/base.html' %}
{% load static %}

{% block title %}OLX - Главная страница{% endblock %}

{% block content %}
<!-- MAIN -->
<main class="max-w-6xl mx-auto px-4 py-12">
  <h1 class="text-2xl md:text-3xl font-bold text-center text-[#002f34] mb-12">Главные категории</h1>

  <!-- categories grid -->
  <div id="categoriesGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-6 mb-12"></div>

  <!-- selected category block -->
  <div class="bg-white rounded-lg shadow-sm p-6 md:p-8 border border-gray-100">
    <h2 class="text-base md:text-lg font-bold mb-6 pb-4 border-b border-gray-100">
      Категория: <span id="selectedCategoryName" class="text-cyan-600"></span>
    </h2>
    <div id="subCategoriesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
  </div>

  <!-- VIP -->
  <section class="mt-16">
    <h2 class="text-2xl font-bold text-center text-[#002f34] mb-8">VIP-объявления</h2>

    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <div class="flex justify-center mt-12">
      <a href="{% url 'announcement_search_page' %}"
        class="border-2 border-[#002f34] text-[#002f34] px-8 py-3 font-bold hover:bg-[#002f34] hover:text-white transition rounded">
        Посмотреть все
      </a>
    </div>
  </section>
</main>
{% endblock %}

{% block extra_js %}
<script>
  // --- Data (из Django) ---
  const CATEGORIES = [
    {% for category in categories %}
  {
    id: "{{ category.slug|escapejs }}",
      name: "{{ category.name|escapejs }}",
        img: "{% if category.image %}{{ category.image.url|escapejs }}{% endif %}",
          subCategories: [
            {% for child in category.children.all %}
  { name: "{{ child.name|escapejs }}", slug: "{{ child.slug|escapejs }}" },
  {% endfor %}
      ]
    },
  {% endfor %}
  ];

  const PRODUCTS = [
    {% for ann in announcements %}
  {
    id: {{ ann.id }},
    slug: "{{ ann.slug|escapejs }}",
      title: "{{ ann.name|escapejs }}",
        price: "{{ ann.price|escapejs }}",
          location: "{{ ann.district.name|escapejs }}, {{ ann.district.region.name|escapejs }}",
            date: "{{ ann.created_at|date:'Сегодня в H:i' }}",
              img: "{% if ann.images.first %}{{ ann.images.first.image.url|escapejs }}{% endif %}",
                isFavorited: {% if ann.id in fav_ids %} true{% else %} false{% endif %}
  },
  {% endfor %}
  ];

  // --- State ---
  let selectedId = CATEGORIES.length ? CATEGORIES[0].id : null;

  // --- DOM ---
  const categoriesGrid = document.getElementById("categoriesGrid");
  const selectedCategoryName = document.getElementById("selectedCategoryName");
  const subCategoriesGrid = document.getElementById("subCategoriesGrid");
  const productsGrid = document.getElementById("productsGrid");

  function getSelectedCategory() {
    return CATEGORIES.find(c => c.id === selectedId) || null;
  }

  function renderCategories() {
    categoriesGrid.innerHTML = "";
    CATEGORIES.forEach(cat => {
      const isSelected = cat.id === selectedId;
      const wrapper = document.createElement("div");
      wrapper.className = "flex flex-col items-center gap-3 cursor-pointer group";
      wrapper.onclick = () => {
        selectedId = cat.id;
        renderCategories();
        renderSelectedCategory();
      };

      const circle = document.createElement("div");
      circle.className = `w-16 h-16 md:w-20 md:h-20 rounded-full overflow-hidden border-2 transition-all duration-200 ${isSelected ? "border-cyan-500 ring-4 ring-cyan-100 scale-110 shadow-lg" : "border-transparent hover:scale-105"
        }`;

      const img = document.createElement("img");
      img.src = cat.img;
      img.className = "w-full h-full object-cover";

      const name = document.createElement("span");
      name.className = `text-xs md:text-sm font-bold text-center leading-tight ${isSelected ? "text-cyan-600" : "text-[#002f34]"}`;
      name.textContent = cat.name;

      circle.appendChild(img);
      wrapper.appendChild(circle);
      wrapper.appendChild(name);
      categoriesGrid.appendChild(wrapper);
    });
  }

  function renderSelectedCategory() {
    const selected = getSelectedCategory();
    if (!selected) return;
    selectedCategoryName.textContent = selected.name;
    subCategoriesGrid.innerHTML = selected.subCategories.length
      ? selected.subCategories.map(sub => `
          <a href="/category/${sub.slug}/" class="text-xs md:text-sm text-[#002f34] hover:text-cyan-600 flex items-center gap-2 group transition">
            <i class="fa-solid fa-chevron-right text-[8px] text-gray-300 group-hover:text-cyan-600"></i>
            ${sub.name}
          </a>
        `).join("")
      : `<p class="text-sm text-gray-400">Подкатегорий пока нет</p>`;
  }

  function productCardHTML(item) {
    const heartClass = item.isFavorited ? 'fa-solid heart-active text-red-500' : 'fa-regular text-[#002f34]';
    return `
      <a href="/announcement/${item.slug}/" class="bg-white rounded shadow-sm overflow-hidden flex flex-col border border-transparent hover:shadow-md transition cursor-pointer group block">
        <div class="relative h-40 overflow-hidden bg-gray-100">
          <img src="${item.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="">
        </div>
        <div class="p-3 flex-1 flex flex-col justify-between">
          <div>
            <h3 class="text-sm text-[#002f34] leading-tight mb-2 line-clamp-2">${item.title}</h3>
            <p class="text-[10px] text-gray-400 mb-2">${item.location} - ${item.date}</p>
          </div>
          <div class="flex items-center justify-between mt-2">
            <span class="font-bold text-sm text-[#002f34]">${item.price} сум</span>
            <i class="${heartClass} fa-heart text-lg hover:text-red-500 transition-colors" 
               onclick="event.preventDefault(); toggleFavorite(${item.id}, this)"></i>
          </div>
        </div>
      </a>
    `;
  }

  function renderProducts() {
    productsGrid.innerHTML = PRODUCTS.map(productCardHTML).join("");
  }

  renderCategories();
  renderSelectedCategory();
  renderProducts();
</script>
{% endblock %}
