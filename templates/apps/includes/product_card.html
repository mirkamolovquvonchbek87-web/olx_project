<a href="{% url 'announcement_detail' slug=ann.slug %}"
    class="bg-white rounded shadow-sm overflow-hidden flex flex-col border border-transparent hover:shadow-md transition cursor-pointer group block">
    <div class="relative h-40 overflow-hidden bg-gray-100">
        {% if ann.images.first %}
        <img src="{{ ann.images.first.image.url }}"
            class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="">
        {% else %}
        <div class="w-full h-full flex flex-col items-center justify-center text-gray-300">
            <i class="fa-regular fa-image text-3xl mb-2"></i>
            <span class="text-xs">Нет фото</span>
        </div>
        {% endif %}
        {% if ann.product_type == 'vip' %}
        <span
            class="absolute bottom-2 left-2 bg-[#23e5db] text-[#002f34] text-[10px] font-bold px-1 uppercase">ТОП</span>
        {% endif %}
    </div>
    <div class="p-3 flex-1 flex flex-col justify-between">
        <div>
          <h3 class="text-sm text-[#002f34] leading-tight mb-2 line-clamp-2 group-hover:text-cyan-600 transition">
                {{ ann.name }}
             </h3>
        <p class="text-[10px] text-gray-400 mb-2">
            {% if ann.district %}
                {{ ann.district.name }}, {{ ann.district.region.name }}
            {% endif %}
            - {{ ann.created_at|date:"d M H:i" }}
        </p>
        </div>
        <div class="flex items-center justify-between mt-2">
            <span class="font-bold text-sm text-[#002f34]">{{ ann.price }} сум</span>
            <i class="{% if ann.id in fav_ids %}fa-solid heart-active{% else %}fa-regular{% endif %} fa-heart text-lg text-[#002f34] hover:text-red-500 transition-colors"
                onclick="event.preventDefault(); toggleFavorite({{ ann.id }}, this)"></i>
        </div>
    </div>
</a>
